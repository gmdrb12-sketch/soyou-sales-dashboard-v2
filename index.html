<!doctype html>
<html lang="ko">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root{font-family:Arial,"Noto Sans KR",sans-serif;color:#18202b;background:#f4f6f8}
    *{box-sizing:border-box} body{margin:0;padding:28px}.wrap{max-width:920px;margin:auto}
    h1{margin:0 0 6px;font-size:27px}.sub{color:#687386;margin-bottom:22px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{background:#fff;border:1px solid #dfe4ea;border-radius:14px;padding:18px;box-shadow:0 2px 9px #0000000a}
    .card h2{font-size:17px;margin:0 0 4px}.hint{font-size:13px;color:#7b8492;margin-bottom:12px}
    input{width:100%;border:1px dashed #aeb7c3;border-radius:9px;padding:12px;background:#fafbfc}
    .state{font-size:13px;margin-top:9px;min-height:18px;color:#6b7280}.ok{color:#087f5b}.bad{color:#c92a2a}
    .actions{display:flex;align-items:center;gap:14px;margin-top:20px}.btn{border:0;border-radius:10px;background:#e8192c;color:white;font-weight:700;font-size:16px;padding:14px 24px;cursor:pointer}.btn:disabled{opacity:.45;cursor:not-allowed}
    #result{white-space:pre-line;font-size:14px}.notice{margin-top:18px;padding:13px 15px;border-radius:10px;background:#fff3bf;color:#674d00;font-size:13px}
    @media(max-width:680px){body{padding:16px}.grid{grid-template-columns:1fr}}
  </style>
</head>
<body><main class="wrap">
  <h1>SoYU 견적 데이터 업데이트</h1>
  <div class="sub">이카운트에서 내려받은 XLSX 파일을 분류에 맞게 선택하세요.</div>
  <section class="grid" id="slots"></section>
  <div class="actions"><button class="btn" id="uploadBtn" disabled>선택한 파일 업데이트</button><div id="result"></div></div>
  <div class="notice">선택하지 않은 분류의 기존 데이터는 변경되지 않습니다. 잘못 선택한 법인·개인 또는 진행상태 파일은 업데이트 전에 자동으로 차단됩니다.</div>
</main>
<script>
const SLOT_CONFIG = [
  ['corp_pending','법인 · 가망고객','(주)소유티앤이 / 가망고객'],
  ['person_pending','개인 · 가망고객','소유티앤이 / 가망고객'],
  ['corp_success','법인 · 수주성공','(주)소유티앤이 / 수주성공'],
  ['person_success','개인 · 수주성공','소유티앤이 / 수주성공'],
  ['corp_fail','법인 · 수주실패','(주)소유티앤이 / 수주실패'],
  ['person_fail','개인 · 수주실패','소유티앤이 / 수주실패']
];
const parsed = new Map();
const slots = document.getElementById('slots');
SLOT_CONFIG.forEach(([key,title,hint])=>{
  const card=document.createElement('article'); card.className='card';
  card.innerHTML=`<h2>${title}</h2><div class="hint">${hint}</div><input id="${key}" type="file" accept=".xlsx"><div class="state" id="state_${key}">파일을 선택하지 않음</div>`;
  slots.appendChild(card);
  card.querySelector('input').addEventListener('change',e=>readFile(key,e.target.files[0]));
});

async function readFile(key,file){
  const state=document.getElementById('state_'+key);
  parsed.delete(key); updateButton();
  if(!file){state.className='state';state.textContent='파일을 선택하지 않음';return;}
  try{
    const buf=await file.arrayBuffer();
    const wb=XLSX.read(buf,{type:'array',cellDates:false});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const matrix=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:''});
    const headerIndex=matrix.findIndex(row=>row.some(v=>clean(v)==='일자-No.'));
    if(headerIndex<0) throw new Error('일자-No. 헤더를 찾을 수 없습니다.');
    const headers=matrix[headerIndex].map(clean);
    const periodLine=clean((matrix[0]||[])[0]);
    const rows=matrix.slice(headerIndex+1).filter(row=>/^\d{8}-\d+$/.test(clean(row[0]))).map(row=>headers.map((_,i)=>normalizeCell(headers[i],row[i])));
    if(!rows.length) throw new Error('견적 데이터가 없습니다.');
    const item={key,filename:file.name,periodLine,headers,rows};
    validateClient(item);
    parsed.set(key,item);
    state.className='state ok';state.textContent=`확인 완료 · ${rows.length.toLocaleString()}건`;
  }catch(err){state.className='state bad';state.textContent=err.message;}
  updateButton();
}

function validateClient(file){
  const cfg=SLOT_CONFIG.find(v=>v[0]===file.key);
  const corpExpected=file.key.startsWith('corp_');
  const isCorp=file.periodLine.includes('(주)소유티앤이');
  if(corpExpected!==isCorp) throw new Error(corpExpected?'개인 자료입니다.':'법인 자료입니다.');
  const expected=file.key.endsWith('_pending')?'가망고객':file.key.endsWith('_success')?'수주성공':'수주실패';
  const si=file.headers.indexOf('진행상태');
  if(si<0) throw new Error('진행상태 열이 없습니다.');
  const bad=[...new Set(file.rows.map(r=>clean(r[si])).filter(v=>v!==expected))];
  if(bad.length) throw new Error(`진행상태 불일치: ${bad.join(', ')}`);
}
function normalizeCell(header,value){
  const v=clean(value);
  if(header==='대면영업여부'){
    const s=v.toLowerCase();
    if(['o','○','●','ㅇ','y','yes','대면'].includes(s)) return 'O';
    if(['x','×','n','no','비대면'].includes(s)) return 'X';
  }
  if(header==='금액합계(VAT포함)'||header==='수량합계') return v.replace(/\.0+$/,'');
  return v;
}
function clean(v){return String(v??'').trim();}
function updateButton(){document.getElementById('uploadBtn').disabled=parsed.size===0;}

document.getElementById('uploadBtn').addEventListener('click',()=>{
  const btn=document.getElementById('uploadBtn'), result=document.getElementById('result');
  btn.disabled=true; result.className=''; result.textContent='업데이트 중...';
  google.script.run
    .withSuccessHandler(res=>{result.className='ok';result.textContent=res.results.map(v=>`${v.sheet}: ${v.rows}건`).join(' · ')+`\n완료 ${res.updatedAt}`;parsed.clear();document.querySelectorAll('input[type=file]').forEach(i=>i.value='');document.querySelectorAll('.state').forEach(s=>{s.className='state';s.textContent='파일을 선택하지 않음';});updateButton();})
    .withFailureHandler(err=>{result.className='bad';result.textContent='실패: '+(err.message||err);btn.disabled=false;})
    .updateQuoteSheets({files:[...parsed.values()]});
});
</script></body></html>
